<div class="card h-100 shadow-sm border-0">
  <a [routerLink]="['/productos', producto().id]" class="text-decoration-none text-dark">
    <div
      class="bg-light d-flex align-items-center justify-content-center overflow-hidden border-bottom"
      style="height: 185px"
    >
      <img
        [src]="producto().imagen || '/img/placeholder-producto.jpg'"
        [alt]="producto().nombre"
        class="w-100 h-100 p-2"
        style="object-fit: contain"
      />
    </div>
  </a>

  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <span class="badge bg-secondary">{{ producto().categoria }}</span>

      <span
        class="badge"
        [ngClass]="{
          'bg-success': producto().stock >= 5,
          'bg-warning text-dark': producto().stock > 0 && producto().stock < 5,
          'bg-danger': producto().stock === 0,
        }"
      >
        @if (producto().stock > 0) {
          Stock: {{ producto().stock }}
        } @else {
          Agotado
        }
      </span>
    </div>

    <h5 class="card-title mb-2">
      <a [routerLink]="['/productos', producto().id]" class="text-decoration-none text-dark">
        {{ producto().nombre }}
      </a>
    </h5>
    <p class="card-text text-muted small flex-grow-1">
      {{ producto().descripcion }}
    </p>

    <div class="d-flex align-items-center justify-content-between my-2">
      <span class="small text-dark fw-bold">Cantidad:</span>
      <div class="btn-group btn-group-sm" role="group" aria-label="Cantidad del producto">
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="disminuir()"
          [disabled]="cantidad() <= 1 || producto().stock === 0"
        >
          -
        </button>
        <span class="btn btn-outline-secondary disabled fw-semibold text-dark px-2">
          {{ cantidad() }}
        </span>
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="aumentar()"
          [disabled]="cantidad() >= producto().stock || producto().stock === 0"
        >
          +
        </button>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-2 gap-2">
      <span class="fs-6 fw-bold text-primary">
        {{ producto().precio | currency: 'Bs. ' : 'symbol' : '1.2-2' : 'es-BO' }}
      </span>

      <div class="d-flex gap-1">
        <button
          type="button"
          class="btn btn-sm btn-outline-warning text-dark"
          [disabled]="producto().stock === 0"
          (click)="alAnadir()"
        >
          + Añadir
        </button>
        <button
          type="button"
          class="btn btn-sm btn-primary"
          [disabled]="producto().stock === 0"
          (click)="alPedir()"
        >
          Pedir
        </button>
      </div>
    </div>
  </div>
</div>
